<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Solar Explorer — Gowtham Sai Chimmana</title>
  </head>
  <body>
    <div id="app"></div>

    <a id="exit-game" href="/">← Exit to Portfolio</a>

    <div id="top-bar">
      <button id="mute-toggle">🔊</button>
      <select id="quality-select">
        <option value="low">Low</option>
        <option value="medium" selected>Medium</option>
        <option value="high">High</option>
        <option value="ultra">Ultra</option>
      </select>
    </div>

    <div id="progress-panel">
      <div class="title"><span>PORTFOLIO RESTORATION</span><span id="progress-pct">0%</span></div>
      <div id="progress-track"><div id="progress-bar"></div></div>
      <div id="objective-label">OBJECTIVE</div>
      <div id="objective-text">Click a planet to travel there.</div>
      <div id="progress-label" style="display:none"></div>
    </div>

    <div id="interact-prompt"></div>
    <div id="discovery-toast"></div>
    <div id="bottom-hud">🚀 Solar map: click a planet · On a planet: W/S move · A/D turn · Space jump · E interact · M back to map</div>

    <div id="touch-controls">
      <button id="touch-left">◀</button>
      <button id="touch-jump">▲</button>
      <button id="touch-right">▶</button>
    </div>

    <div id="panel-overlay">
      <div id="panel-card"></div>
    </div>

    <script type="module" src="/src/solar/main.js"></script>
  </body>
</html>
